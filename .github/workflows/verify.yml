name: Verify engine
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/screenshots/**"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Test ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax, unit and Modbus TCP loopback tests
        run: npm run check
